name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Build and test
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Run build gates
        run: ./gradlew clean check releaseArtifacts

      - name: Upload versioned jars
        uses: actions/upload-artifact@v4
        with:
          name: StayLoaded-${{ github.sha }}
          path: |
            paper-1_21_11/build/libs/*-mc1.21.11.jar
            paper-26_2/build/libs/*-mc26.2.jar
          if-no-files-found: error
