name: StayLoaded
version: '${version}'
main: io.github.jakubrasken.stayloaded.paper.StayLoadedPlugin
description: Log off. Stay loaded.
author: JakubRasken
website: https://github.com/JakubRasken/StayLoaded
api-version: '26.2'
folia-supported: false
commands:
  stayloaded:
    description: Disconnects and leaves an experimental server-side stand-in.
    usage: /<command> [30s|10m|1h] [reason] | /<command> terminate <player>
    permission: stayloaded.use
  stayloaded-debug:
    description: Manages development-only synthetic player probes.
    usage: /<command> probe <spawn [world x y z]|remove <uuid>|count|clear>
    permission: stayloaded.admin.debug
permissions:
  stayloaded.use:
    description: Allows experimental StayLoaded player handoff.
    default: op
  stayloaded.terminate:
    description: Allows terminating another player's StayLoaded session.
    default: op
    children:
      stayloaded.use: true
  stayloaded.admin.debug:
    description: Allows unsafe StayLoaded development probes.
    default: op
