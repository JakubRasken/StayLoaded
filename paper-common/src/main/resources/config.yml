# Unsafe development facility. This does not hand off a real player's identity.
debug-probes-enabled: false

# Experimental: real-player inventory/state handoff is not production-ready.
experimental-handoff:
  enabled: false
  allow-insecure-offline-mode: false
  default-duration-seconds: 300
  max-duration-seconds: 3600
  # How often (seconds) an active stand-in's player data is written to disk.
  # 0 disables periodic checkpointing. Lower values narrow the crash window
  # but increase disk writes per stand-in.
  checkpoint-interval-seconds: 60
