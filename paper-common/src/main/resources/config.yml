# Unsafe development facility. This does not hand off a real player's identity.
debug-probes-enabled: false

# Experimental: real-player inventory/state handoff is not production-ready.
experimental-handoff:
  enabled: false
  allow-insecure-offline-mode: false
  default-duration-seconds: 300
  max-duration-seconds: 3600
  # How often (seconds) an active stand-in's player data is written to disk.
  # 0 disables periodic checkpointing. Lower values narrow the crash window
  # but increase disk writes per stand-in.
  checkpoint-interval-seconds: 60
  # Whether an orderly server restart keeps active stand-ins alive. On a
  # crash (no clean shutdown), sessions are terminated instead and their
  # last checkpoint is left as the authoritative player data.
  restore-after-restart: false
  # How many times a stand-in may respawn (at its bed/anchor or world spawn)
  # after dying before its session is ended with the last checkpoint intact.
  max-stand-in-respawns: 3

# Announce session start/end to every online player.
broadcast-session-changes: false

# Anonymous, aggregate operation metrics. No player names or UUIDs are
# recorded. Stored in plugins/StayLoaded/metrics.json and viewable with
# /stayloaded metrics. Disable to opt out entirely.
metrics:
  enabled: true

# MiniMessage templates for operator output. Any key may be customized;
# missing keys fall back to built-in defaults.
messages:
  session-started: "<green>Your StayLoaded stand-in is starting."
  session-started-broadcast: "<yellow><player> left a StayLoaded stand-in (<duration>)."
  session-ended-broadcast: "<yellow><player>'s StayLoaded stand-in ended (<reason>)."
  help-header: "<yellow>StayLoaded - log off, stay loaded."
  help-what: "<gray>Disconnect safely: a server-side stand-in keeps your farms and simulation running while you are away, then hands everything back when you return."
  help-usage: "<green>/stayloaded [duration] [reason]"
  help-usage-detail: "<gray>  Duration: <white>30s</white>, <white>10m</white>, or <white>1h</white> (default <white><default></white>). Optional reason is saved with the session."
  help-example: "<gray>  Example: <white>/stayloaded 2h iron farm</white> - leave a stand-in for 2 hours."
  help-commands: "<gray>Commands: <white>help</white>, <white>start [duration]</white>, <white>stop [player]</white>, <white>stopall</white>, <white>status [player]</white>, <white>list</white>, <white>reload</white>, <white>metrics</white>"
  help-return: "<gray>Rejoin any time to reclaim your session; it ends automatically when the timer runs out."
  help-warning: "<red>Experimental: not for valuable worlds yet."
  status-header: "<yellow>Your StayLoaded session:"
  status-remaining: "<gray>Remaining: <white><remaining></white>"
  status-expires: "<gray>Expires: <white><expires></white>"
  status-note: "<gray>Note: <white><note></white>"
  status-none: "<gray>You have no active StayLoaded session. Use <white>/sl 30m</white> to start one."
  stop-usage: "<gray>Usage: /sl stop [player]"
  duration-invalid: "<red>Duration must be between 1 second and <max> seconds."
  duration-format: "<red>Use a duration such as 30s, 10m, or 1h."
  start-failed: "<red>StayLoaded could not start safely: <error>"
  terminate-usage: "<red>Usage: /stayloaded terminate <player>"
  terminate-permission: "<red>You do not have permission to terminate StayLoaded sessions."
  terminate-unknown-player: "<red>No player named '<player>' is online."
  terminate-done: "<green>Terminated the StayLoaded session for <player>."
  terminate-failed: "<red>StayLoaded could not terminate safely: <error>"
  list-empty: "<gray>No active StayLoaded sessions."
  list-header: "<yellow>StayLoaded sessions:"
  list-entry: "<gray>- <white><player></gray> (<yellow><status></yellow>, <white><remaining></white> remaining)"
  info-header: "<yellow>StayLoaded session for <player>:"
  info-status: "<gray>Status: <white><status></gray>"
  info-started: "<gray>Started: <white><started></gray>"
  info-expires: "<gray>Expires: <white><expires></gray>"
  info-note: "<gray>Note: <white><note></gray>"
  info-respawns: "<gray>Respawns: <white><respawns></gray>"
  info-none: "<gray>No StayLoaded session exists for <player>."
  reload-done: "<green>StayLoaded configuration reloaded."
  reload-failed: "<red>StayLoaded could not reload: <error>"
  metrics-header: "<yellow>StayLoaded metrics:"
  metrics-entry: "<gray>- <white><name></gray>: <yellow><count></yellow>"
  metrics-empty: "<gray>No StayLoaded metrics recorded yet."
  metrics-opt-out: "<gray>Metrics are disabled in config.yml."
  metrics-failed: "<red>StayLoaded metrics could not be read: <error>"
